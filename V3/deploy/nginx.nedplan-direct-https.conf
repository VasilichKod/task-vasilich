server {
    listen 80;
    listen [::]:80;
    server_name nedplan.ru www.nedplan.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://nedplan.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nedplan.ru www.nedplan.ru;
    ssl_certificate /etc/letsencrypt/live/nedplan.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nedplan.ru/privkey.pem;
    ssl_protocols TLSv1.2;
    ssl_session_cache shared:NEDPLAN_SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
