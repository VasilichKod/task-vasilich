upstream podo_origin_https {
    server 109.172.37.55:443;
    keepalive 8;
}

upstream english_origin_https {
    server 109.172.37.55:443;
    keepalive 8;
}

upstream hel27_origin_https {
    server 109.172.37.55:443;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name podo.nedplan.ru english.nedplan.ru hel27.ru www.hel27.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name podo.nedplan.ru;

    ssl_certificate /etc/letsencrypt/live/podo.nedplan.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podo.nedplan.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass https://podo_origin_https;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_ssl_server_name on;
        proxy_ssl_name podo.nedplan.ru;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}

