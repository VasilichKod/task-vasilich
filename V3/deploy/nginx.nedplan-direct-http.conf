server {
    listen 80;
    listen [::]:80;
    server_name nedplan.ru www.nedplan.ru;
    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        default_type text/plain;
        add_header Retry-After 300 always;
        return 503 "NePlan is being restored. HTTPS will activate after DNS propagation. Please return shortly.\n";
    }
}
